server:
  port: 8080

spring:
  application:
    name: 2f-agro-soa

  datasource:
    url: jdbc:h2:mem:agrodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    # Garante que o data.sql execute DEPOIS de o Hibernate criar as tabelas.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: embedded

  h2:
    console:
      enabled: true
      path: /h2-console
